name: Generate sing-box rules
on:
  push:
    branches: [main]
    paths: ['*.list', 'scripts/**', 'test_*.py', '.github/workflows/generate-singbox.yml']
  pull_request:
    paths: ['*.list', 'scripts/**', 'test_*.py', '.github/workflows/generate-singbox.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: singbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: python scripts/generate_singbox.py
      - name: Publish generated JSON on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sing-box
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate sing-box rule sets'
            git push origin HEAD:main
          fi
